name: StudioNet scenario-reserve proofs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vector-reserve-studionet
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned tooling
        run: |
          pip install -r requirements-dev.txt
          npm install --global genlayer@0.39.2
          genvm-lint download --version v0.2.16
      - name: Lint, direct tests and independent terminal-balance oracle
        run: |
          genvm-lint check contracts/vector_reserve.py --json
          python -m pytest tests/direct -q --junitxml=proofs/cloud-direct-tests.xml
          node scripts/check-scenarios.cjs
      - name: Prepare encrypted disposable participants and outsider
        run: node scripts/bootstrap-ci.cjs
      - name: Deploy and exercise two scenario-margin books
        run: node scripts/live-proof.cjs
      - name: Verify fresh receipts, source, actual calls and complete ledgers
        run: node scripts/verify-proofs.cjs
      - name: Upload sanitized receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studionet-proofs
          path: |
            proofs/*.json
            proofs/*.xml
          if-no-files-found: warn
